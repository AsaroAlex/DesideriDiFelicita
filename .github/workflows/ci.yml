name: Controlli

# Test, controllo dei tipi e build a ogni push e pull request: un errore qui
# va corretto prima che Railway pubblichi la versione su `main`.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installa le dipendenze
        run: npm ci
      - name: Test (database temporanei, nessun messaggio reale)
        run: npm test
      - name: Controllo dei tipi
        run: npm run check
      - name: Build del sito
        run: npm run build
        env:
          SITE_URL: https://desideri-di-felicita-production.up.railway.app
          BASE_PATH: /
