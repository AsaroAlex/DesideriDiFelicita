name: Deploy to GitHub Pages

# Pubblica il sito a ogni push su `main` (branch di produzione, quando esisterà)
# o sul branch di lavoro corrente, oppure manualmente (workflow_dispatch).
# NB: in GitHub → Settings → Pages impostare "Source: GitHub Actions".
# Consigliato: adottare `main` come branch di default e rimuovere da qui il branch
# di lavoro quando non servirà più.
on:
  push:
    branches:
      - main
      - claude/elegant-rubin-k4j11u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione alla volta
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build con Astro
        # Esegue install + build e carica l'artifact per Pages.
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
