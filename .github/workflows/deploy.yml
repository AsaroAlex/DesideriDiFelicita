name: Deploy to GitHub Pages

# Pubblica il sito a ogni push su `main` (branch di produzione) oppure manualmente.
# NB: in GitHub → Settings → Pages impostare "Source: GitHub Actions" e `main` come
# branch di default; l'ambiente `github-pages` deve consentire il deploy da `main`.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione alla volta
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build con Astro
        # Esegue install + build e carica l'artifact per Pages.
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
