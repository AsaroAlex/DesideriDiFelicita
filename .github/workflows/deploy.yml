name: Deploy to GitHub Pages

# Pubblica il sito quando si fa push sul branch di lavoro/default (oppure manualmente).
# NB: in GitHub → Settings → Pages, impostare "Source: GitHub Actions".
# Quando adotterai un branch "main" come default, il deploy partirà anche da lì.
on:
  push:
    branches:
      - main
      - claude/elegant-rubin-k4j11u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione alla volta
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build con Astro
        # Esegue install + build e carica l'artifact per Pages.
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
