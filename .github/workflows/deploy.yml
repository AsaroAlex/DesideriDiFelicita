name: GitHub Pages (vecchio indirizzo → sito ufficiale)

# Il sito ufficiale, con calendario e agenda, è pubblicato da Railway a ogni push su `main`.
# Il vecchio indirizzo https://asaroalex.github.io/DesideriDiFelicita/ resta attivo solo
# per reindirizzare i link già condivisi alla stessa pagina del sito ufficiale.
# Con un dominio personalizzato basta aggiornare PRODUCTION_URL qui sotto.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://desideri-di-felicita-production.up.railway.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepara i reindirizzamenti
        run: node scripts/pages-redirect.mjs
      - name: Carica l'artifact per Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
