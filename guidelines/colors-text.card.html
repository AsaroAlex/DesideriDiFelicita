<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-bg)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:20px}
  .sw{border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .chip{height:60px}
  .meta{padding:7px 10px;background:#fff;border:1px solid var(--color-line);border-top:0}
  .name{font-size:.74rem;font-weight:600;color:var(--color-ink)}
  .hex{font-size:.66rem;color:var(--color-muted);letter-spacing:.03em}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--color-ink-soft)"></div><div class="meta"><div class="name">Ink soft</div><div class="hex">#4c5868</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-muted)"></div><div class="meta"><div class="name">Muted</div><div class="hex">#687085</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-line)"></div><div class="meta"><div class="name">Line</div><div class="hex">#e6ded2</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-whatsapp)"></div><div class="meta"><div class="name">WhatsApp</div><div class="hex">#25d366</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-whatsapp-strong)"></div><div class="meta"><div class="name">WA strong</div><div class="hex">#1da851</div></div></div>
</div>
</body></html>
