<!-- @dsCard group="Colors" viewport="700x150" name="Gold & blush accents" subtitle="Warm gold/bronze accent + powder rose softener" -->
<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-bg)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:20px}
  .sw{border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .chip{height:74px}
  .meta{padding:8px 11px;background:#fff;border:1px solid var(--color-line);border-top:0}
  .name{font-size:.78rem;font-weight:600;color:var(--color-ink)}
  .hex{font-size:.7rem;color:var(--color-muted);letter-spacing:.04em}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--color-gold)"></div><div class="meta"><div class="name">Gold</div><div class="hex">#c2a268</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-gold-strong)"></div><div class="meta"><div class="name">Gold strong</div><div class="hex">#a6864a</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-gold-text)"></div><div class="meta"><div class="name">Gold text · AA</div><div class="hex">#856832</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-blush)"></div><div class="meta"><div class="name">Blush</div><div class="hex">#e6c3c6</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-blush-soft)"></div><div class="meta"><div class="name">Blush soft</div><div class="hex">#f7eded</div></div></div>
</div>
</body></html>
