<!-- @dsCard group="Type" viewport="700x150" name="Eyebrow & numerals" subtitle="Spaced uppercase gold labels and editorial index numbers" -->
<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-body);background:var(--color-bg)}
  .wrap{padding:26px 28px;display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .eyebrow{display:inline-flex;align-items:center;gap:.7em;font-size:var(--fs-100);font-weight:600;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-gold-text)}
  .eyebrow::before{content:'';width:2rem;height:1px;background:currentColor;opacity:.7}
  .num{font-family:var(--font-display);font-size:2.4rem;color:var(--color-gold);font-feature-settings:'tnum'}
  .nums{display:flex;gap:18px;align-items:baseline}
  .cap{font-size:.66rem;color:var(--color-muted);letter-spacing:.06em;text-transform:uppercase}
</style></head><body>
<div class="wrap">
  <div>
    <span class="eyebrow">La nostra specialità</span>
    <div class="cap" style="margin-top:10px">tracking 0.22em · gold strong</div>
  </div>
  <div>
    <div class="nums"><span class="num">01</span><span class="num">02</span><span class="num">03</span></div>
    <div class="cap" style="margin-top:6px">Fraunces · tabular numerals</div>
  </div>
</div>
</body></html>
